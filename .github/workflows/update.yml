name: Update games & stats
on:
  schedule:
    - cron: '17 4 * * *'   # every day ~06:17 Kyiv
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "yehorye"
          git config user.email "efimove130308@gmail.com"
          git add games.js eybl.js eybl20.js data/state.json
          git diff --cached --quiet || (git commit -m "Auto-update games & stats" && git push)
